<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ClusterNebula banner">
  <rect width="1200" height="360" fill="#F7F6F1"/>
  <path d="M0 0H1200V360H0V0Z" fill="url(#grid)" opacity=".42"/>
  <circle cx="180" cy="245" r="112" stroke="#101010" stroke-width="28" opacity=".05"/>
  <circle cx="1006" cy="96" r="92" stroke="#101010" stroke-width="22" opacity=".05"/>
  <g transform="translate(664 -32) rotate(-12 240 210)" opacity=".62">
    <rect x="58" y="36" width="430" height="286" fill="url(#hatch)" stroke="#101010" stroke-width="2"/>
    <rect x="160" y="102" width="226" height="142" fill="#F7F6F1" stroke="#101010" stroke-width="2" opacity=".82"/>
    <path d="M160 102L58 36M386 102L488 36M160 244L58 322M386 244L488 322" stroke="#101010" stroke-width="2" opacity=".55"/>
  </g>
  <text x="72" y="92" fill="#101010" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="900" letter-spacing="7">LOCAL K-MEANS / CSV / THREE.JS</text>
  <text x="72" y="174" fill="#101010" font-family="Trebuchet MS, Verdana, sans-serif" font-size="72" font-weight="900" letter-spacing="4">clusternebula</text>
  <rect x="72" y="196" width="344" height="14" fill="url(#bars)"/>
  <text x="72" y="270" fill="#101010" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="800">A full-screen 3D clustering studio for CSV data.</text>
  <g transform="translate(760 224)">
    <circle cx="0" cy="0" r="12" fill="#101010"/>
    <circle cx="74" cy="-30" r="12" fill="#FF4D3E"/>
    <circle cx="140" cy="18" r="12" fill="#245CFF"/>
    <circle cx="218" cy="-18" r="12" fill="#16A46B"/>
    <circle cx="286" cy="24" r="12" fill="#F4CF35" stroke="#101010" stroke-width="3"/>
    <path d="M0 0L74 -30L140 18L218 -18L286 24M74 -30L218 -18M0 0L140 18" stroke="#101010" stroke-width="5" stroke-linecap="round" opacity=".64"/>
  </g>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#101010" stroke-opacity=".12"/>
